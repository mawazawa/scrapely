name: Deploy services
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Quality checks run on all pushes and PRs
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript Check
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm --filter @meridian/scrapers test --run
        continue-on-error: true

      - name: Security Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # Deploy only runs on main branch pushes
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check Git status before generating migrations
        run: git status --porcelain
        id: pre_migration_status
        working-directory: 'packages/database'

      - name: Generate migrations
        run: pnpm generate
        working-directory: 'packages/database'

      - name: Check if new migrations were created
        id: check_migrations
        run: |
          git status --porcelain
          if [[ $(git status --porcelain | grep -E "^\?\?" | wc -l) -gt 0 ]]; then
            echo "New migration files were created during CI. Please run 'pnpm generate' locally and commit the changes."
            echo "new_files=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          if [[ $(git status --porcelain | grep -E "^M" | wc -l) -gt 0 ]]; then
            echo "Existing migration files were modified during CI. Please run 'pnpm generate' locally and commit the changes."
            echo "modified_files=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "No new or modified migration files detected."
        working-directory: 'packages/database'

      - name: Run database migrations
        run: pnpm db:migrate
        working-directory: 'packages/database'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Set Sentry Release Version
        id: sentry_release
        run: echo "version=meridian@${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: 'apps/scrapers'
          environment: production
          secrets: |
            GOOGLE_BASE_URL
            GOOGLE_API_KEY
            DATABASE_URL
            MERIDIAN_SECRET_KEY
            OPENAI_API_KEY
            ANTHROPIC_API_KEY
            MISTRAL_API_KEY
            FIRECRAWL_API_KEY
            SENTRY_DSN
        env:
          GOOGLE_BASE_URL: ${{ secrets.GOOGLE_BASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MERIDIAN_SECRET_KEY: ${{ secrets.MERIDIAN_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ steps.sentry_release.outputs.version }}
          ENVIRONMENT: production

      - name: Create Sentry Release
        if: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: meridian-scrapers
        with:
          environment: production
          version: ${{ steps.sentry_release.outputs.version }}
          sourcemaps: ./apps/scrapers/dist
        continue-on-error: true

      - name: Smoke Test - Ping API
        run: |
          echo "Testing API health..."
          curl -sf https://meridian-production.alceos.workers.dev/ping || echo "Ping check skipped (worker may not be deployed yet)"
        continue-on-error: true

      - name: Build Nuxt Application
        run: pnpm build --filter=@meridian/frontend
        env:
          NUXT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_FRONTEND }}
          NUXT_PUBLIC_SENTRY_RELEASE: ${{ steps.sentry_release.outputs.version }}
          NUXT_PUBLIC_ENVIRONMENT: production

      - name: Create Sentry Release for Frontend
        if: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: meridian-frontend
        with:
          environment: production
          version: ${{ steps.sentry_release.outputs.version }}
          sourcemaps: ./apps/frontend/.output/public/_nuxt
        continue-on-error: true

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/frontend/.output/public --project-name=meridian-frontend --branch=main
        continue-on-error: true
